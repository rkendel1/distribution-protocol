name: CI

on:
  pull_request:
  workflow_dispatch:
  # Every branch push, not just the default branch, so work is checked on GitHub
  # before a pull request exists. (A PR for the same branch then runs twice.)
  push:
    branches: ['**']

permissions:
  contents: read

# Supersede stale PR runs, but never cancel a run on a pushed commit: a merge
# commit on the default branch must finish so it has a complete result of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Runs the `test` script of every workspace: protocol, registry,
      # conformance and cli.
      - name: Test
        run: npm test

      # Runs the commands in the README quick start verbatim (publish a real
      # artifact to a local HTTP registry, acquire and verify it, then prove a
      # tampered artifact is rejected), so the documented flow cannot rot.
      - name: README quick start
        run: bash scripts/smoke-quickstart.sh

      - name: Regenerate spec artifacts
        run: npm run generate:spec

      # The schema and golden vectors are generated from the code. If
      # regenerating changes (or adds) anything, the committed copies are stale.
      - name: Fail if generated spec files changed
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
